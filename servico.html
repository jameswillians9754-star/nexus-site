<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serviço — NEXUS DESIGNER</title>
<meta name="description" content="Detalhes do serviço de design da Nexus Designer.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/designer.css">
</head>
<body data-page="design" data-brand="designer">
<a class="skip-link" href="#main">Saltar para o conteúdo</a>
<header class="site-header" id="site-header"></header>
<main id="main"><div class="container" style="max-width:820px">
<a class="back" href="designer.html">← Todos os serviços</a>
<div id="svc"></div></div></main>
<div class="sticky-cta" id="cta"></div>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/data.js"></script><script src="assets/js/main.js"></script><script src="assets/js/designer-data.js"></script>
<script>
(function(){
var id=new URLSearchParams(location.search).get("id");
var s=SERVICES.find(function(x){return x.slug===id});
var box=document.getElementById("svc");
if(!s){box.innerHTML='<h1>Serviço não encontrado</h1><p style="margin:10px 0"><a class="btn btn-primary" href="designer.html">Ver serviços</a></p>';document.getElementById("cta").remove();return}
document.title=s.name+" — NEXUS DESIGNER";
var g="";
for(var n=1;n<=sampleN(s.slug);n++){
 var src="assets/amostras/"+s.slug+"-"+n+".jpg";
 g+='<a class="ph" href="'+src+'" target="_blank" rel="noopener"><img loading="lazy" src="'+src+'" alt="Amostra '+n+' de '+s.name+'" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:\'Amostra em breve\'}))"></a>';
}
var li=function(a){return a.map(function(i){return "<li>"+i+"</li>"}).join("")};
box.innerHTML='<span class="eyebrow">Nexus Designer</span><h1 style="margin:8px 0">'+s.name+'</h1><p class="price" style="font-size:1.3rem">'+s.price+'</p><p style="margin:12px 0;color:var(--muted)">'+s.long+'</p>'
+'<div class="detail-block"><h2>Amostras</h2><div class="gallery" style="margin-top:10px">'+g+'</div><p style="font-size:.82rem;color:var(--muted);margin-top:8px">Exemplos ilustrativos do estilo de trabalho. Toca numa imagem para ampliar.</p></div>'
+'<div class="detail-block"><h2>O que inclui</h2><ul class="checklist">'+li(s.includes)+'</ul></div>'
+'<div class="detail-block"><h2>O que precisamos de ti</h2><ul class="checklist">'+li(s.need)+'</ul></div>'
+'<div class="detail-block"><h2>Como pedir</h2><p style="color:var(--muted)">Clica num dos botões, envia as informações acima e combinamos o prazo e a forma de pagamento.</p></div><div style="height:12px"></div>';
var m="Olá! Tenho interesse no serviço: "+s.name+". Podem ajudar-me?";
document.getElementById("cta").innerHTML='<a class="btn btn-wa" target="_blank" rel="noopener" href="'+waLink(m)+'">WhatsApp</a><a class="btn btn-mail" href="'+mailLink("Pedido: "+s.name,m)+'">Email</a>';
if(typeof initReveal==="function")initReveal();
})();
</script>
</body></html>
