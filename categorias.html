<!DOCTYPE html>
<html lang="pt">
<head>

<script>
document.getElementById("catsGrid").innerHTML=CATEGORIES.map(c=>{const n=EBOOKS.filter(b=>b.category===c.id).length;return `<a class="cat-card reveal" href="catalogo.html?categoria=${c.id}"><span class="count">${n} ebook${n===1?"":"s"}</span><h3>${c.name}</h3><p>Abrir catálogo filtrado</p></a>`;}).join("");initReveal();
</script>
