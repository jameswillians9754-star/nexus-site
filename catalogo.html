<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de ebooks — NEXUS EBOOKS</title>
<meta name="description" content="Explora e pesquisa ebooks por título e categoria na NEXUS EBOOKS.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="catalog">
<a class="skip-link" href="#main">Saltar para o conteúdo</a>
<header class="site-header" id="site-header"></header>
<main id="main">
<section class="page-hero"><div class="container"><h1>Explora os nossos ebooks</h1><p>Pesquisa por título ou filtra por categoria para encontrar conteúdos sobre negócios, finanças, tecnologia, culinária e muito mais.</p></div></section>
<section style="padding-top:8px"><div class="container">
<div class="controls">
<div class="search-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><label for="searchInput" class="skip-link">Pesquisar ebook por título</label><input type="search" id="searchInput" placeholder="Pesquisar por título..." autocomplete="off"></div>
<label for="categorySelect" class="skip-link">Filtrar por categoria</label><select id="categorySelect"><option value="">Todas as categorias</option></select></div>
<p class="result-count" id="resultCount" role="status" aria-live="polite"></p>
<div class="grid" id="catalogGrid"></div>
<div class="empty" id="emptyState" hidden><h2 style="font-size:1.1rem;margin-bottom:8px">Nenhum ebook encontrado</h2><p>Tenta outra pesquisa ou escolhe uma categoria diferente.</p></div>
</div></section></main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/data.js"></script><script src="assets/js/main.js"></script>
<script>
const grid=document.getElementById("catalogGrid"),count=document.getElementById("resultCount"),empty=document.getElementById("emptyState");
const sel=document.getElementById("categorySelect"),search=document.getElementById("searchInput");
CATEGORIES.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
const params=new URLSearchParams(location.search);
if(params.get("categoria"))sel.value=params.get("categoria");
if(params.get("q"))search.value=params.get("q");
function render(){const q=search.value.trim().toLowerCase(),cat=sel.value;
const list=EBOOKS.filter(b=>(!cat||b.category===cat)&&(!q||b.title.toLowerCase().includes(q)));
count.textContent=list.length+" resultado"+(list.length===1?"":"s")+(cat?" em "+catName(cat):"")+(q?' para "'+search.value.trim()+'"':"");
grid.innerHTML=list.map(cardHTML).join("");empty.hidden=list.length>0;grid.hidden=list.length===0;initReveal();}
search.addEventListener("input",render);sel.addEventListener("change",render);render();
</script>
</body></html>
